name: Daily Finviz Sync to Supabase

on:
  schedule:
    # 1. Apertura bursátil: 9:00 AM Colombia (14:00 UTC, Lunes a Viernes)
    - cron: '0 14 * * 1-5'
    # 2. Mitad de jornada: 12:00 PM Colombia (17:00 UTC, Lunes a Viernes)
    - cron: '0 17 * * 1-5'
    # 3. Pre-cierre de Wall Street: 3:30 PM Colombia (20:30 UTC, Lunes a Viernes)
    - cron: '30 20 * * 1-5'
  workflow_dispatch: # Permite ejecutarlo manualmente desde GitHub si se desea

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Ejecutar Sincronización Diaria Finviz
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          uv run .agents/skills/finviz-inversor-colombia/scripts/finviz_sync.py sync --min-market-cap 1000 --retention-days 30

      - name: Sincronización Incremental de Precios Históricos (Yahoo Finance)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          uv run scripts/sync_prices_history.py --mode auto --workers 16

