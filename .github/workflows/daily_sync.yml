name: Daily Finviz Sync to Supabase

on:
  # Disparado automáticamente con puntualidad exacta desde Supabase pg_cron + pg_net (workflow_dispatch)
  # Horarios Lunes a Viernes (Hora Colombia UTC-5):
  #   - 09:30 AM COL (14:30 UTC) · Apertura Wall Street
  #   - 11:30 AM COL (16:30 UTC) · Media mañana
  #   - 01:30 PM COL (18:30 UTC) · Tarde bursátil
  #   - 03:30 PM COL (20:30 UTC) · Cierre EDT / Pre-cierre EST
  #   - 04:15 PM COL (21:15 UTC) · Cierre oficial Wall Street EST
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Ejecutar Sincronización Diaria Finviz
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          uv run .agents/skills/finviz-inversor-colombia/scripts/finviz_sync.py sync --min-market-cap 1000 --retention-days 30 --batch-size 100

      - name: Sincronización Incremental de Precios Históricos (Yahoo Finance)
        if: success() || failure()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          uv run scripts/sync_prices_history.py --mode auto --workers 16

