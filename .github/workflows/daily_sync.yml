name: Daily Finviz Sync to Supabase

on:
  schedule:
    # Actualización automática cada 2 horas durante jornada de mercado abierto (Wall Street, Lunes a Viernes)
    # 1. Apertura / Primera sesión: 9:30 AM Colombia (14:30 UTC)
    - cron: '30 14 * * 1-5'
    # 2. Media mañana: 11:30 AM Colombia (16:30 UTC)
    - cron: '30 16 * * 1-5'
    # 3. Tarde bursátil: 1:30 PM Colombia (18:30 UTC)
    - cron: '30 18 * * 1-5'
    # 4. Cierre horario verano (EDT) / Pre-cierre (EST): 3:30 PM Colombia (20:30 UTC)
    - cron: '30 20 * * 1-5'
    # 5. Cierre de jornada Wall Street (horario estándar EST): 4:15 PM Colombia (21:15 UTC)
    - cron: '15 21 * * 1-5'
  workflow_dispatch: # Permite ejecutarlo manualmente desde GitHub si se desea

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Ejecutar Sincronización Diaria Finviz
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          uv run .agents/skills/finviz-inversor-colombia/scripts/finviz_sync.py sync --min-market-cap 1000 --retention-days 30 --batch-size 100

      - name: Sincronización Incremental de Precios Históricos (Yahoo Finance)
        if: success() || failure()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          uv run scripts/sync_prices_history.py --mode auto --workers 16

